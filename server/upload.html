<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Himig - Add a song</title>
<style>
  body { font-family: system-ui, sans-serif; background: #132228; color: #F5EED2; max-width: 560px; margin: 0 auto; padding: 24px 16px; }
  h1 { color: #EBAE29; }
  label { display: block; margin-top: 14px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 6px; border-radius: 10px; border: 1px solid #24424A; background: #1D3238; color: inherit; font-size: 16px; }
  button { margin-top: 18px; padding: 12px 20px; border: 0; border-radius: 999px; background: #EBAE29; color: #132228; font-weight: 800; font-size: 16px; cursor: pointer; }
  li { padding: 10px 0; border-bottom: 1px solid #24424A; list-style: none; }
  ul { padding: 0; }
  small { color: #589C80; }
  .failed small { color: #E5645B; }
</style>
<h1>Himig Karaoke</h1>
<form id="f">
  <label>Title <input name="title" required maxlength="200"></label>
  <label>Artist <input name="artist" required maxlength="200"></label>
  <label>Audio file <input name="file" type="file" accept="audio/*" required></label>
  <button>Prepare karaoke version</button>
</form>
<p id="msg" role="status"></p>
<h2>Songs</h2>
<ul id="list"></ul>
<script>
  const msg = document.getElementById('msg'), list = document.getElementById('list');
  async function refresh() {
    const songs = await (await fetch('/songs')).json();
    list.replaceChildren(...songs.map(s => {
      const li = document.createElement('li');
      li.className = s.status;
      const note = s.status === 'ready' ? (s.has_lyrics ? 'ready, with lyrics' : 'ready, no lyrics found')
        : s.status === 'failed' ? 'failed: ' + (s.error || '') : 'preparing, about 4 minutes...';
      li.append(`${s.title} - ${s.artist} `, Object.assign(document.createElement('small'), { textContent: note }));
      return li;
    }));
  }
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = 'Uploading...';
    const res = await fetch('/songs', { method: 'POST', body: new FormData(e.target) });
    msg.textContent = res.ok ? 'Added. Preparing in the background.' : (await res.json()).detail;
    if (res.ok) e.target.reset();
    refresh();
  });
  refresh();
  setInterval(refresh, 5000);
</script>
</html>
